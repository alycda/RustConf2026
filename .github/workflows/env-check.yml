# Verification matrix — self-check map, bare except cbindgen.
#
# Every cell runs scripts/self-check.sh on a stock runner plus ONE install:
# cbindgen. The first bare mapping run showed it is the single required
# tool no runner image ships (rustc/cargo 1.97 and a linking C compiler
# are on all three OSes), so with it provisioned the rust/c rows assert
# the full required-toolchain contract per OS, and the optional-track rows
# still report what the stock images cover. The red/green grid is the
# observation, not a regression gate — it maps which cells need real
# provisioning recipes, before the matrix is trimmed for heavy testing.
#
# Cell verdicts:
#   - rust, c   → the script's exit code (its required-toolchain contract:
#                 rustc + cargo + cbindgen + a C compiler that links).
#                 Both tracks share one verdict because the script does.
#   - python, dart, kotlin, swift
#               → green only if the script's own line for that track says
#                 "ready". The script's exit code is ignored for these:
#                 an optional track can be ready on a runner whose
#                 required toolchain is not (and vice versa), and that
#                 difference is signal.
#
#          | linux | macos | windows |
#   rust   |   .   |   .   |    .    |
#   c      |   .   |   .   |    .    |
#   python |   .   |   .   |    .    |
#   dart   |   .   |   .   |    .    |
#   kotlin |   .   |   .   |    .    |
#   swift  |   .   |   .   |    ?    |
#
# Expected from the bare mapping run: rust/c green on all three OSes once
# cbindgen lands; kotlin green everywhere (kotlinc + JDK ship on every
# image); swift green on ubuntu and macos; python green only on macos
# (its system python3 imports cffi); dart red everywhere. The windows
# column runs under Git Bash, which is already more than the workshop
# promises (self-check's own Windows answer is WSL2) — its results are
# information, not commitments.

name: Verify

# push alone, no pull_request: this repo's validation flow pushes wip/*
# branches directly, so every commit already gets a push run — a PR trigger
# would run the same jobs a second time (concurrency groups keyed on
# github.ref never cancel across the branch/merge-ref pair).
on:
  push:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.track }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARILY trimmed to the linux column for heavy iteration:
        # linux is the 1x-billed runner, so the full track row costs ~6
        # billed minutes per push instead of ~78 (macos is 10x, windows
        # 2x, and billing rounds up per job). The full map has already
        # been taken — its findings live in the header above. Restore the
        # full grid by swapping the os line back to:
        #   os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        track: [rust, c, python, dart, kotlin, swift]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary for the same reason the track workflows give:
      # `cargo install cbindgen` compiles from source for minutes; the
      # install-action downloads in seconds. Verified on linux and macos
      # runners already; windows is this step's own experiment — if the
      # cell dies here, `cargo install cbindgen --locked` is the fallback.
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      # ON ICE: kotlin and swift provisioning. Those cells are green today
      # only because GitHub's stock images happen to ship the toolchains
      # (kotlinc + a JDK on all three OSes, Swift on ubuntu and macos).
      # When either cell goes red with no change on our side, an upstream
      # image update dropped them — the fix is uncommenting the matching
      # block, not archaeology. The kotlin block is the exact recipe
      # validated green in kotlin.yml (pinned zip, checksum computed from
      # that download); the swift block is the standard action but is
      # UNVERIFIED by us — expect to pin a version that matches whatever
      # the image shipped last.
      #
      # - uses: actions/setup-java@v4
      #   if: matrix.track == 'kotlin'
      #   with:
      #     distribution: temurin
      #     java-version: '17'
      # - name: provision kotlinc (pinned release zip)
      #   if: matrix.track == 'kotlin'
      #   shell: bash
      #   run: |
      #     curl -fsSL -o kotlin-compiler.zip \
      #       "https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip"
      #     echo "b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  kotlin-compiler.zip" \
      #       | shasum -a 256 -c -
      #     unzip -q kotlin-compiler.zip -d "${RUNNER_TEMP}"
      #     echo "${RUNNER_TEMP}/kotlinc/bin" >> "$GITHUB_PATH"
      #
      # - uses: swift-actions/setup-swift@v2
      #   if: matrix.track == 'swift' && runner.os == 'Linux'
      #   with:
      #     swift-version: '6.0'
      #
      # The dart cell gets the SDK from the official action — the
      # workshop's own answer (`just setup-dart`) is brew/website guidance
      # written for humans, not runners.
      - uses: dart-lang/setup-dart@v1
        if: matrix.track == 'dart'
        with:
          sdk: stable
      # The python cell provisions its track the way `just setup-python`
      # does — a repo-local .venv — because that is the path self-check
      # probes first (it prefers ./.venv/bin/python even when the venv is
      # not activated, exactly the case here).
      - name: provision cffi (the setup-python recipe)
        if: matrix.track == 'python'
        shell: bash
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip cffi
      # shell: bash so the windows cells run under Git Bash rather than
      # PowerShell — the closest a native-Windows runner gets to running
      # this script at all.
      - name: self-check (stock image + cbindgen)
        shell: bash
        # rust/c assert the script's required-toolchain contract (its exit
        # code); track cells ask the script itself via --track, whose exit
        # code is the machine contract self-check.sh now owns — no more
        # grepping human-facing labels that reword themselves red.
        run: |
          case "${{ matrix.track }}" in
            rust|c)
              ./scripts/self-check.sh
              ;;
            *)
              ./scripts/self-check.sh --track "${{ matrix.track }}"
              ;;
          esac
      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Swift on 2023-12-01), prove the track end to end — cdylib, header from
      # the cbindgen this job already installs, then solve.swift against the
      # puzzle-statement example. Real inputs stay out of CI by the same rule
      # that keeps them out of the repo (days/.gitignore); statement examples
      # are published in the puzzle text and fair game. The seven lines below
      # are part two's example, and the two parts answer 209 and 281 — two
      # different numbers on one input, so neither assertion can be satisfied
      # by the other part's answer.
      #
      # `just` is not on a stock runner, so the swift-demo recipe's steps are
      # spelled out here rather than invoked — same as the python and dart
      # cells. Branches without the worked track skip cleanly.
      #
      # This track fetches nothing: no pip, no pub, no pinned jar from Maven.
      # The C API arrives through the generated header, which module.modulemap
      # hands to clang, so the only inputs are the ones this repo built.
      #
      # No `swift build`/SwiftPM here on purpose. A Package.swift would want
      # its own manifest, its own systemLibrary target and its own opinion
      # about where the cdylib lives; `swiftc` with an -I and two -L/-rpath
      # pairs is the same thing the recipe does, and keeping the two identical
      # is what makes a red cell here mean something about the track rather
      # than about a second build system.
      - name: swift track end-to-end (2023-12-01)
        if: matrix.track == 'swift'
        shell: bash
        run: |
          if [ ! -f days/2023-12-01/swift/solve.swift ]; then
            echo "no worked swift track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2023-12-01 --lib)
          (cd days/2023-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2023_12_01.h src/c_api.rs)
          mkdir -p days/inputs
          printf '%s\n' 'two1nine' 'eightwothree' 'abcone2threexyz' 'xtwone3four' \
            '4nineeightseven2' 'zoneight234' '7pqrstsixteen' > days/inputs/2023-12-01.txt
          target="$(cd days/target && pwd)"
          cd days/2023-12-01/swift
          mkdir -p .build
          swiftc solve.swift -o .build/solve \
            -I . \
            -L "$target/debug" -L "$target/release" \
            -laoc_2023_12_01 \
            -Xlinker -rpath -Xlinker "$target/debug" \
            -Xlinker -rpath -Xlinker "$target/release"
          out="$(./.build/solve)"
          echo "$out"
          # Two assertions, not one, because they fail for different reasons
          # and only one of them is a real problem.
          #
          # First the answers, matched loosely: this is the thing that must be
          # true, and it stays true however the line is labelled.
          echo "$out" | grep -qE '^Part 1 .*: 209$'
          echo "$out" | grep -qE '^Part 2 .*: 281$'
          # Then the label, byte for byte, because the `Part N <emoji>(🦀)`
          # shape is a repo-wide convention and silent drift in it is worth a
          # red cell. Kept separate so this failure can say which one it was —
          # a bare `exit 1` after two correct answers reads as a broken track
          # when it is actually a cosmetic edit that did not reach this file.
          #
          # This cell has the same variation-selector trap the Kotlin one
          # does, and it is meant literally: 🕊️ is U+1F54A DOVE followed by
          # U+FE0F VARIATION SELECTOR-16 — seven bytes, the last three
          # invisible. A bare 🕊 (U+1F54A alone) renders identically here, in
          # most editors, and in a browser, and will NOT match this grep.
          #
          # So do not retype the label if you change it: copy it out of
          # days/2023-12-01/swift/solve.swift, or generate both sides from the
          # same bytes. Two of the four track cells now carry this footgun
          # (☕️ = U+2615 + U+FE0F on the Kotlin one), which is a good argument
          # for picking selector-free emoji for any track added later — 🐍 and
          # 🎯 are each a single codepoint, and neither cell needs this note.
          if ! echo "$out" | grep -qF 'Part 1 🕊️(🦀): 209' \
            || ! echo "$out" | grep -qF 'Part 2 🕊️(🦀): 281'; then
            echo "::error::answers are correct but the label drifted — re-sync this step with days/2023-12-01/swift/solve.swift" >&2
            exit 1
          fi
