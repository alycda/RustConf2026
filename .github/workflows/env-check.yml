# Verification matrix — self-check map, bare except cbindgen.
#
# Every cell runs scripts/self-check.sh on a stock runner plus ONE install:
# cbindgen. The first bare mapping run showed it is the single required
# tool no runner image ships (rustc/cargo 1.97 and a linking C compiler
# are on all three OSes), so with it provisioned the rust/c rows assert
# the full required-toolchain contract per OS, and the optional-track rows
# still report what the stock images cover. The red/green grid is the
# observation, not a regression gate — it maps which cells need real
# provisioning recipes, before the matrix is trimmed for heavy testing.
#
# Cell verdicts:
#   - rust, c   → the script's exit code (its required-toolchain contract:
#                 rustc + cargo + cbindgen + a C compiler that links).
#                 Both tracks share one verdict because the script does.
#   - python, dart, kotlin, swift
#               → green only if the script's own line for that track says
#                 "ready". The script's exit code is ignored for these:
#                 an optional track can be ready on a runner whose
#                 required toolchain is not (and vice versa), and that
#                 difference is signal.
#
#          | linux | macos | windows |
#   rust   |   .   |   .   |    .    |
#   c      |   .   |   .   |    .    |
#   python |   .   |   .   |    .    |
#   dart   |   .   |   .   |    .    |
#   kotlin |   .   |   .   |    .    |
#   swift  |   .   |   .   |    ?    |
#
# Expected from the bare mapping run: rust/c green on all three OSes once
# cbindgen lands; kotlin green everywhere (kotlinc + JDK ship on every
# image); swift green on ubuntu and macos; python green only on macos
# (its system python3 imports cffi); dart red everywhere. The windows
# column runs under Git Bash, which is already more than the workshop
# promises (self-check's own Windows answer is WSL2) — its results are
# information, not commitments.
#
# Answered by the first full-grid run (2026-08-25): python and dart go
# green everywhere with their provisioning steps; swift/windows was red —
# the stock image ships no Swift — and is now excluded from the matrix
# outright, the observation being recorded here.

name: Verify

# push alone, no pull_request: this repo's validation flow pushes wip/*
# branches directly, so every commit already gets a push run — a PR trigger
# would run the same jobs a second time (concurrency groups keyed on
# github.ref never cancel across the branch/merge-ref pair).
on:
  push:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.track }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full grid, restored: it was trimmed to the linux column while
        # the repo was private (macos bills 10x there), but public repos
        # are not billed for standard runners, and this map of attendee
        # environments across all three OSes is the workflow's whole job.
        os: [ubuntu-latest, macos-latest, windows-latest]
        track: [rust, c, python, dart, kotlin, swift]
        # swift/windows was the grid's "?" cell and the first full-grid
        # run answered it: no Swift on the stock image, and the workshop's
        # Windows answer is WSL2 regardless. An answered question needs no
        # recurring red job — delete this exclude to start watching the
        # cell again if Swift on native Windows ever matters.
        exclude:
          - os: windows-latest
            track: swift
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Prebuilt binary for the same reason the track workflows give:
      # `cargo install cbindgen` compiles from source for minutes; the
      # install-action downloads in seconds. Verified on linux and macos
      # runners already; windows is this step's own experiment — if the
      # cell dies here, `cargo install cbindgen --locked` is the fallback.
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen,just
      # ON ICE: kotlin and swift provisioning. Those cells are green today
      # only because GitHub's stock images happen to ship the toolchains
      # (kotlinc + a JDK on all three OSes, Swift on ubuntu and macos).
      # When either cell goes red with no change on our side, an upstream
      # image update dropped them — the fix is uncommenting the matching
      # block, not archaeology. The kotlin block is the exact recipe
      # validated green in kotlin.yml (pinned zip, checksum computed from
      # that download); the swift block is the standard action but is
      # UNVERIFIED by us — expect to pin a version that matches whatever
      # the image shipped last.
      #
      # - uses: actions/setup-java@v4
      #   if: matrix.track == 'kotlin'
      #   with:
      #     distribution: temurin
      #     java-version: '17'
      # - name: provision kotlinc (pinned release zip)
      #   if: matrix.track == 'kotlin'
      #   shell: bash
      #   run: |
      #     curl -fsSL -o kotlin-compiler.zip \
      #       "https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip"
      #     echo "b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  kotlin-compiler.zip" \
      #       | shasum -a 256 -c -
      #     unzip -q kotlin-compiler.zip -d "${RUNNER_TEMP}"
      #     echo "${RUNNER_TEMP}/kotlinc/bin" >> "$GITHUB_PATH"
      #
      # - uses: swift-actions/setup-swift@v2
      #   if: matrix.track == 'swift' && runner.os == 'Linux'
      #   with:
      #     swift-version: '6.0'
      #
      # The dart cell gets the SDK from the official action — the
      # workshop's own answer (`just setup-dart`) is brew/website guidance
      # written for humans, not runners.
      - uses: dart-lang/setup-dart@v1
        if: matrix.track == 'dart'
        with:
          sdk: stable
      # The python cell provisions its track the way `just setup-python`
      # does — a repo-local .venv — because that is the path self-check
      # probes first (it prefers the venv python even when the venv is
      # not activated, exactly the case here). The interpreter's location
      # depends on the OS that built the venv: bin/ everywhere except
      # native Windows, which uses Scripts/ — the same two layouts
      # self-check's probe_python walks.
      - name: provision cffi (the setup-python recipe)
        if: matrix.track == 'python'
        shell: bash
        run: |
          python3 -m venv .venv
          py="$(scripts/venv-python.sh)"
          "$py" -m pip install --upgrade pip cffi
      # shell: bash so the windows cells run under Git Bash rather than
      # PowerShell — the closest a native-Windows runner gets to running
      # this script at all.
      - name: self-check (stock image + cbindgen)
        shell: bash
        # rust/c assert the script's required-toolchain contract (its exit
        # code); track cells ask the script itself via --track, whose exit
        # code is the machine contract self-check.sh now owns — no more
        # grepping human-facing labels that reword themselves red.
        run: |
          case "${{ matrix.track }}" in
            rust|c)
              ./scripts/self-check.sh
              ;;
            *)
              ./scripts/self-check.sh --track "${{ matrix.track }}"
              ;;
          esac
      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Python/cffi on 2015-12-01), prove the track end to end — cdylib
      # with default features (no C libraries needed), header from the
      # cbindgen this job already installs, then solve.py against the
      # puzzle-statement example. Real inputs stay out of CI by the same
      # rule that keeps them out of the repo (.gitignore); statement
      # examples are published in the puzzle text and fair game. "()())"
      # answers part 1 with -1 — a negative through the out-param, which a
      # naive in-band error convention would have eaten — and part 2 with 5.
      # Branches without the worked track (e.g. main today) skip cleanly.
      # The end-to-end steps below run on every OS their track has a cell
      # on. Their first full-grid run (wip/ffi-ci, 2026-09-04) was red on
      # Windows for three reasons that lived in the steps and the tracks,
      # not in the days: the venv python is under Scripts/ not bin/,
      # Git-for-Windows bash ships sha256sum but not shasum, and a cdylib
      # there is aoc_<day>.dll with no lib prefix. Each step and lookup now
      # handles its own; the workshop's Windows answer is still WSL2 (see
      # the swift exclude in the matrix).
      - name: python track end-to-end (2015-12-01)
        if: matrix.track == 'python'
        shell: bash
        run: |
          if [ ! -f days/2015-12-01/python/solve.py ]; then
            echo "no worked python track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2015-12-01 --lib)
          (cd days/2015-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2015_12_01.h src/c_api.rs)
          mkdir -p inputs
          printf '()())' > inputs/2015-12-01.txt
          py="$(scripts/venv-python.sh)"
          out="$("$py" days/2015-12-01/python/solve.py)"
          echo "$out"
          echo "$out" | grep -F 'Part 1 🐍(🦀): -1'
          echo "$out" | grep -F 'Part 2 🐍(🦀): 5'

      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Dart/dart:ffi on 2015-12-05), prove the track end to end — cdylib
      # with default features, header from the cbindgen this job already
      # installs, then solve.dart against the puzzle-statement examples.
      # Real inputs stay out of CI by the same rule that keeps them out of
      # the repo (.gitignore); statement examples are published in the
      # puzzle text and fair game. The list below is both parts' examples
      # concatenated, with `aaa` twice — deliberately, so the two answers
      # differ (3 and 2). All nine distinct examples split into two disjoint
      # pairs, one nice per part, which makes 2 and 2: an assertion that
      # cannot tell part 1 from part 2, and would still pass if solve.dart
      # called one of them twice or the C API wired both symbols to the same
      # function. `aaa` is part-1 nice and part-2 naughty, so a second copy
      # moves one count and not the other.
      #
      # Default features is the load-bearing word: this day's vectorscan and
      # ICU variants are cargo features precisely so a stock runner with no
      # pkg-config can build the cdylib the C API and this track need.
      #
      # `just` is not on a stock runner, so the dart-demo recipe's steps are
      # spelled out here rather than invoked — same as the python cell.
      # Branches without the worked track skip cleanly.
      - name: dart track end-to-end (2015-12-05)
        if: matrix.track == 'dart'
        shell: bash
        run: |
          if [ ! -f days/2015-12-05/dart/solve.dart ]; then
            echo "no worked dart track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2015-12-05 --lib)
          (cd days/2015-12-05 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2015_12_05.h src/c_api.rs)
          mkdir -p inputs
          printf '%s\n' ugknbfddgicrmopn aaa aaa jchzalrnumimnmhp \
            haegwjzuvuyypxyu dvszwmarrgswjxmb qjhvhtzxzqqjkmpb xxyxx \
            uurcxstgmygtbstg ieodomkazucvgmuy > inputs/2015-12-05.txt
          (cd days/2015-12-05/dart && dart pub get)
          out="$(cd days/2015-12-05/dart && dart run solve.dart)"
          echo "$out"
          # -q: the run's own two lines are echoed above, and a grep that
          # reprints its match makes one run look like two in the log. On a
          # mismatch the step still fails (shell: bash runs with -e) and the
          # echo above is the diff.
          echo "$out" | grep -qF 'Part 1 🎯(🦀): 3'
          echo "$out" | grep -qF 'Part 2 🎯(🦀): 2'

      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Kotlin/JNA on 2021-12-02), prove the track end to end — cdylib with
      # default features, header from the cbindgen this job already installs,
      # then solve.kt against the puzzle-statement example. Real inputs stay
      # out of CI by the same rule that keeps them out of the repo
      # (.gitignore); statement examples are published in the puzzle text
      # and fair game — the six commands below are the example both parts
      # share, and they answer 150 and 900.
      #
      # Default features is the load-bearing word: this day's two C variants
      # (Chipmunk2D and DuckDB) are cargo features precisely so a stock runner
      # with no pkg-config can build the cdylib the C API and this track need.
      # nixpkgs ships a .pc for neither library, so even a runner that *had*
      # pkg-config would not find them — the gate is the only reason this
      # builds at all here.
      #
      # `just` is not on a stock runner, so the kotlin-demo recipe's steps are
      # spelled out here rather than invoked — same as the python cell — and
      # the JNA jar is pinned and checksummed here exactly as the recipe pins
      # and checksums it. Branches without the worked track skip cleanly.
      #
      # The `:` classpath separator is why this step is linux/macos-shaped. If
      # the windows column is ever restored (see the os matrix above), this is
      # the line that needs `;` there.
      - name: kotlin track end-to-end (2021-12-02)
        if: matrix.track == 'kotlin'
        shell: bash
        run: |
          if [ ! -f days/2021-12-02/kotlin/solve.kt ]; then
            echo "no worked kotlin track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2021-12-02 --lib)
          (cd days/2021-12-02 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2021_12_02.h src/c_api.rs)
          mkdir -p inputs
          printf '%s\n' 'forward 5' 'down 5' 'forward 8' 'up 3' 'down 8' \
            'forward 2' > inputs/2021-12-02.txt
          cd days/2021-12-02/kotlin
          jna="$(../../../scripts/fetch-jna.sh)"
          kotlinc solve.kt -classpath "$jna" -include-runtime -d solve.jar
          cp_sep=:
          [ "${RUNNER_OS:-}" = Windows ] && cp_sep=';'
          out="$(java -cp "solve.jar${cp_sep}${jna}" SolveKt)"
          echo "$out"
          # Two assertions, not one, because they fail for different reasons
          # and only one of them is a real problem.
          #
          # First the answers, matched loosely: this is the thing that must be
          # true, and it stays true however the line is labelled.
          echo "$out" | grep -qE '^Part 1 .*: 150$'
          echo "$out" | grep -qE '^Part 2 .*: 900$'
          # Then the label, byte for byte, because the `Part N <emoji>(🦀)`
          # shape is a repo-wide convention and silent drift in it is worth a
          # red cell. Kept separate so this failure can say which one it was —
          # a bare `exit 1` after two correct answers reads as a broken track
          # when it is actually a cosmetic edit that did not reach this file.
          #
          # Byte for byte is meant literally: this label is ☕️ = U+2615 plus
          # U+FE0F (VARIATION SELECTOR-16). A bare ☕ (U+2615 alone) renders
          # identically here and in most editors and will not match. If you
          # change the label in kotlin/solve.kt, copy it — do not retype it.
          if ! echo "$out" | grep -qF 'Part 1 ☕️(🦀): 150' \
            || ! echo "$out" | grep -qF 'Part 2 ☕️(🦀): 900'; then
            echo "::error::answers are correct but the label drifted — re-sync this step with days/2021-12-02/kotlin/solve.kt" >&2
            exit 1
          fi

      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Swift on 2023-12-01), prove the track end to end — cdylib, header from
      # the cbindgen this job already installs, then solve.swift against the
      # puzzle-statement example. Real inputs stay out of CI by the same rule
      # that keeps them out of the repo (.gitignore); statement examples
      # are published in the puzzle text and fair game.
      #
      # The four lines below are part ONE's published example, verbatim, and
      # both assertions are numbers days/2023-12-01/src/lib.rs asserts over
      # that same input: 142 from `test_part1`, and 142 again for part two
      # from `test_both_parts_over_both_examples`.
      #
      # Verbatim is the rule, not a detail. A track's job here is to prove it
      # gets the same answer Rust does, so it has to be handed the same bytes
      # Rust was. An input tweaked until the numbers came out conveniently --
      # this cell briefly had one, four lines plus `eightwothree` -- proves a
      # track agrees with a figure that exists nowhere else in the repo, and
      # adds a fifth thing to keep in sync.
      #
      # This day makes that tempting because its two parts have *different*
      # statement examples: 142 comes from these four lines, 281 from part
      # two's seven, and no single input yields both. A track reads one file
      # and prints both parts, so one of the two numbers it prints is always
      # a part the puzzle publishes no answer for. The fix is more
      # assertions, not a different input -- the rstest grid in lib.rs covers
      # both parts over *both* examples, so either can be used here as-is.
      #
      # The cost of this particular choice, stated rather than hidden: part
      # one's example has no spelled-out digits, so both parts answer 142 and
      # the two assertions cannot tell each other apart -- a track that ran
      # part one twice would pass this cell. Swapping to part two's seven
      # lines (209 and 281, also pinned by that grid) buys that back if it
      # ever matters more than showing the number the statement is known for.
      #
      # `just` is not on a stock runner, so the swift-demo recipe's steps are
      # spelled out here rather than invoked — same as the python and dart
      # cells. Branches without the worked track skip cleanly.
      #
      # This track fetches nothing: no pip, no pub, no pinned jar from Maven.
      # The C API arrives through the generated header, which module.modulemap
      # hands to clang, so the only inputs are the ones this repo built.
      #
      # No `swift build`/SwiftPM here on purpose. A Package.swift would want
      # its own manifest, its own systemLibrary target and its own opinion
      # about where the cdylib lives; `swiftc` with an -I and two -L/-rpath
      # pairs is the same thing the recipe does, and keeping the two identical
      # is what makes a red cell here mean something about the track rather
      # than about a second build system.
      - name: swift track end-to-end (2023-12-01)
        if: matrix.track == 'swift'
        shell: bash
        run: |
          if [ ! -f days/2023-12-01/swift/solve.swift ]; then
            echo "no worked swift track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2023-12-01 --lib)
          (cd days/2023-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2023_12_01.h src/c_api.rs)
          mkdir -p inputs
          inputs="$(cd inputs && pwd)"
          target="$(cd days/target && pwd)"
          cd days/2023-12-01/swift
          mkdir -p .build
          # Mirrors the swift-demo recipe's corelibs block, and is inert here:
          # a stock runner's Swift ships Foundation with the toolchain, so the
          # guard is false and no flag is added. It is spelled out anyway
          # because this step promises to be the recipe's steps, and a cell
          # that has quietly diverged stops meaning anything about the track.
          # In the repo's Swift devcontainer the guard is true — see
          # .devcontainer/swift/README.md for the failure ladder, and note the
          # -rpath pair is not redundant with -L: -L resolves the link, only
          # -rpath resolves the load.
          swiftc solve.swift -o .build/solve \
            -I . \
            $(../../../scripts/swift-corelibs-flags.sh) \
            -L "$target/debug" -L "$target/release" \
            -laoc_2023_12_01 \
            -Xlinker -rpath -Xlinker "$target/debug" \
            -Xlinker -rpath -Xlinker "$target/release"
          # Run the track once per statement example — this day has two, and
          # each part's published answer belongs to a different one. A track
          # reads one input file and prints both parts, so each run shows and
          # asserts only the part whose example is loaded; the other number
          # (part two scoring part one's example, and vice versa) is already
          # pinned in Rust by test_both_parts_over_both_examples and would
          # only be noise in this log. What this step prints is exactly the
          # day's two published answers, byte for byte as the track does:
          #
          #   Part 1 🕊️(🦀): 142
          #   Part 2 🕊️(🦀): 281
          #
          # The label match is byte-exact on purpose — the `Part N <emoji>(🦀)`
          # shape is a repo-wide convention and silent drift in it is worth a
          # red cell. This cell shares the Kotlin cell's variation-selector
          # trap: 🕊️ is U+1F54A DOVE followed by U+FE0F VARIATION
          # SELECTOR-16 — seven bytes, the last three invisible — and a bare
          # 🕊 (U+1F54A alone) renders identically but will NOT match. Do not
          # retype the label: copy it out of days/2023-12-01/swift/solve.swift.
          assert_part() {   # <N> <published answer>
            local part="$1" answer="$2" out
            out="$(./.build/solve)"
            # Shows exactly one line — this run's part — and fails the cell
            # if the track stopped printing it.
            echo "$out" | grep "^Part ${part} "
            # The answer, matched loosely: true however the line is labelled.
            echo "$out" | grep -qE "^Part ${part} .*: ${answer}$"
            # Then the label, byte for byte (see above).
            if ! echo "$out" | grep -qF "Part ${part} 🕊️(🦀): ${answer}"; then
              echo "::error::part ${part}: answer is correct but the label drifted — re-sync this step with days/2023-12-01/swift/solve.swift" >&2
              exit 1
            fi
          }
          # Part one's example, part one's published answer.
          printf '%s\n' '1abc2' 'pqr3stu8vwx' 'a1b2c3d4e5f' 'treb7uchet' \
            > "$inputs/2023-12-01.txt"
          assert_part 1 142
          # Part two's example, part two's published answer.
          printf '%s\n' 'two1nine' 'eightwothree' 'abcone2threexyz' 'xtwone3four' \
            '4nineeightseven2' 'zoneight234' '7pqrstsixteen' \
            > "$inputs/2023-12-01.txt"
          assert_part 2 281
      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Python/cffi on 2024-12-01), prove the track end to end — cdylib
      # with default features (no C libraries needed), header from the
      # cbindgen this job already installs, then solve.py against the
      # puzzle-statement example. Real inputs stay out of CI by the same
      # rule that keeps them out of the repo (.gitignore); statement
      # examples are published in the puzzle text and fair game. The six
      # pairs answer part 1 with 11 and part 2 with 31 — the same numbers
      # days/2024-12-01/src/lib.rs pins in test_day1_part1/test_day1_part2
      # over the same bytes, and they differ, so the assertions can tell
      # the parts apart. Branches without the worked track skip cleanly.
      - name: python track end-to-end (2024-12-01)
        if: matrix.track == 'python'
        shell: bash
        run: |
          if [ ! -f days/2024-12-01/python/solve.py ]; then
            echo "no worked python track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2024-12-01 --lib)
          (cd days/2024-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2024_12_01.h src/c_api.rs)
          mkdir -p inputs
          printf '3   4\n4   3\n2   5\n1   3\n3   9\n3   3\n' > inputs/2024-12-01.txt
          py="$(scripts/venv-python.sh)"
          out="$("$py" days/2024-12-01/python/solve.py)"
          echo "$out"
          echo "$out" | grep -qF 'Part 1 🐍(🦀): 11'
          echo "$out" | grep -qF 'Part 2 🐍(🦀): 31'
      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Dart/dart:ffi on 2024-12-01), prove the track end to end — same
      # input, same pinned numbers, same reasoning as the python cell above:
      # 11 and 31 are what test_day1_part1/test_day1_part2 assert over these
      # exact bytes, and they differ, so the assertions can tell the parts
      # apart. Branches without the worked track skip cleanly.
      - name: dart track end-to-end (2024-12-01)
        if: matrix.track == 'dart'
        shell: bash
        run: |
          if [ ! -f days/2024-12-01/dart/solve.dart ]; then
            echo "no worked dart track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2024-12-01 --lib)
          (cd days/2024-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2024_12_01.h src/c_api.rs)
          mkdir -p inputs
          printf '3   4\n4   3\n2   5\n1   3\n3   9\n3   3\n' > inputs/2024-12-01.txt
          (cd days/2024-12-01/dart && dart pub get)
          out="$(cd days/2024-12-01/dart && dart run solve.dart)"
          echo "$out"
          echo "$out" | grep -qF 'Part 1 🎯(🦀): 11'
          echo "$out" | grep -qF 'Part 2 🎯(🦀): 31'
      # Beyond the env check: on a branch that carries a worked Exercise 3
      # (Kotlin/JNA on 2024-12-01), prove the track end to end — same input,
      # same pinned 11/31 as the python and dart cells; the JNA jar is pinned
      # and checksummed here exactly as the kotlin-demo recipe pins it.
      # `just` is not on a stock runner, so the recipe's steps are spelled
      # out here rather than invoked. The `:` classpath separator is why this
      # step is linux/macos-shaped. Branches without the worked track skip
      # cleanly.
      #
      # The label greps are byte-for-byte: ☕️ is U+2615 plus U+FE0F
      # (VARIATION SELECTOR-16); a bare ☕ renders identically and will not
      # match. If you change the label in kotlin/solve.kt, copy it — do not
      # retype it.
      - name: kotlin track end-to-end (2024-12-01)
        if: matrix.track == 'kotlin'
        shell: bash
        run: |
          if [ ! -f days/2024-12-01/kotlin/solve.kt ]; then
            echo "no worked kotlin track on this branch — skipping"
            exit 0
          fi
          (cd days && cargo build -p aoc-2024-12-01 --lib)
          (cd days/2024-12-01 && mkdir -p include && \
            cbindgen --config cbindgen.toml --output include/aoc_2024_12_01.h src/c_api.rs)
          mkdir -p inputs
          printf '3   4\n4   3\n2   5\n1   3\n3   9\n3   3\n' > inputs/2024-12-01.txt
          cd days/2024-12-01/kotlin
          jna="$(../../../scripts/fetch-jna.sh)"
          kotlinc solve.kt -classpath "$jna" -include-runtime -d solve.jar
          cp_sep=:
          [ "${RUNNER_OS:-}" = Windows ] && cp_sep=';'
          out="$(java -cp "solve.jar${cp_sep}${jna}" SolveKt)"
          echo "$out"
          echo "$out" | grep -qF 'Part 1 ☕️(🦀): 11'
          echo "$out" | grep -qF 'Part 2 ☕️(🦀): 31'
