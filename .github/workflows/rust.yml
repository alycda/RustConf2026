# Rust CI for the day library (days/).
#
# Scope is deliberately just Rust: the days are pure-Rust AoC solutions today,
# and the FFI steps that will need Python/Kotlin/Swift toolchains don't exist
# on any branch yet. When they land they get their own workflow (or revive the
# verifier in #7) rather than bloating this one.
#
# There is no discovery step and no per-day matrix, because days/Cargo.toml is
# a virtual manifest with `members = ["*"]`: every day is already a workspace
# member, so `cargo test --workspace` covers whatever the branch happens to
# hold. A new `just days new` day is verified by existing, not by being
# registered here — which is the property that matters for the solutions and
# golden-days branches, where days arrive a few at a time.
#
# The flip side of `members = ["*"]` is that a non-crate directory dropped into
# days/ breaks every cargo command in the workspace. That is a real failure and
# CI should show it, so nothing here tries to route around it.

name: Rust

# push alone, no pull_request: this repo's validation flow pushes wip/*
# branches directly, so every commit already gets a push run — a PR trigger
# would run the same jobs a second time (concurrency groups keyed on
# github.ref never cancel across the branch/merge-ref pair).
on:
  push:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo and runs tests.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: days

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: days
      # macOS is in the matrix because most attendees are on it and the
      # workshop's whole subject is linking — the platform where a toolchain
      # goes wrong is the one worth testing on.
      #
      # --locked proves days/Cargo.lock is committed and current. Since the
      # per-day lockfile model was dropped, one shared lock is what pins every
      # day; if it can drift silently, it isn't pinning anything.
      - run: cargo test --workspace --locked
      # The attendee scaffold too, as shipped: todo!() bodies and ignored
      # example tests compile and the one live test runs. The Verify
      # workflow only ever tests the solved overlay copied over this tree.
      - run: cargo test --workspace --locked
        working-directory: exercises

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: days
      - run: cargo fmt --all --check
      # --all-targets so tests and the bin are linted too, not just the lib.
      # Attendees read this code as the model to copy; warnings in the sample
      # are warnings in thirty forks of it.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Same two checks on the scaffold attendees copy from.
      - run: cargo fmt --all --check
        working-directory: exercises
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: exercises

  msrv:
    name: rust 1.85 floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Pinned to the floor the day crates declare (rust-version = "1.85", the
      # edition-2024 minimum) and that scripts/self-check.sh sends attendees
      # away believing. Without this job that floor is a claim nobody tests:
      # a dependency can raise its own MSRV in a patch release and the first
      # person to find out is an attendee on exactly 1.85, mid-workshop.
      #
      # check, not test: this asks "does the floor still compile", and a
      # second full test run on an old toolchain buys nothing for the minutes.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: days
      # --locked is load-bearing here: resolver "3" makes resolution
      # MSRV-aware, so it is the committed lockfile that is under test. Let
      # cargo re-resolve and it would quietly pick versions 1.85 can build,
      # proving something no attendee's checkout will reproduce.
      - run: cargo check --workspace --all-targets --locked
      # exercises/ declares the same 1.85 floor and has its own lockfile.
      - run: cargo check --workspace --all-targets --locked
        working-directory: exercises

  # The jobs above prove the days build *bare* — a linking C compiler, no
  # system library — which is the property the feature gates exist to
  # protect. That proof is worth nothing on its own, though: a feature no
  # job ever turns on is a feature no job can catch a break in, and the
  # bindings behind those gates are `unsafe extern "C"` declarations that
  # nothing type-checks against the headers they were transcribed from. So
  # the gates get tested from both sides, and this is the cheap side.
  #
  # Only 2024-12-01, deliberately: its three variants need nothing a stock
  # runner lacks. qsort is libc; cpp is one .cpp file the cc crate compiles
  # with the runner's C++ compiler; uthash is a header-only library — one
  # distro package on linux, one brew formula on macos, and CFLAGS carries
  # the brew include path because the cc crate does not look under
  # /opt/homebrew on its own. Both OSes, because the workshop's subject is
  # linking and macos is where the attendees are. The days that link real
  # libraries through pkg-config need the nix shell — that is the next job.
  c-features:
    name: C features (2024-12-01) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: days
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends uthash-dev
      - if: runner.os == 'macOS'
        run: |
          brew install uthash
          echo "CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
      # The feature-gated tests assert the published answers *and* that each
      # C-backed answer equals the pure-Rust one — the actual claim every
      # variant makes. --all-targets on clippy so the bindings and the
      # feature-gated benches are linted, not just compiled.
      - run: cargo test -p aoc-2024-12-01 --all-features --locked
      - run: cargo clippy -p aoc-2024-12-01 --all-features --all-targets --locked -- -D warnings

  # The other side of the feature gates, for the days that link real
  # libraries: caca and tcc (2015-12-01), hyperscan and icu (2015-12-05),
  # chipmunk and duckdb (2021-12-02), yara and espeak (2023-12-01). Every
  # one of those build scripts finds its library through pkg-config and,
  # when it can't, panics with "run inside the project's nix shell" — the
  # shell is the supported way to get the C libraries, for attendees and
  # here. So this job runs cargo through `nix-shell` against the repo's
  # own shell.nix instead of hand-provisioning nine libraries from apt.
  # What it proves is the exact environment an attendee gets: the two .pc
  # files shell.nix synthesizes (chipmunk, duckdb), tinycc's shared
  # libtcc, uthash on the cc include path, all of it.
  #
  # `--arg full true` on every invocation below is load-bearing: the default
  # shell is the workshop's five required tools and nothing else, so that
  # attendees cloning on venue Wi-Fi don't download nine C libraries they
  # never link. This job is the reason the full list still exists, and the
  # only thing standing between it and silent rot. Drop the flag and the
  # pkg-config roll call is the step that tells you, in one line.
  #
  # shell.nix reads <nixpkgs> unpinned; nixpkgs-unstable is the nix
  # installer's default channel, which the devcontainer's nix feature
  # leaves in place (setup.sh adds home-manager and touches no other
  # channel).
  #
  # macOS is in the matrix because this job was Linux-only until #1: an
  # attendee's first `nix-shell` on aarch64-darwin died evaluating
  # nixpkgs' chipmunk (glfw2 is Linux-only, and chipmunk lists it for a
  # demo binary), and nothing here ran shell.nix on a mac. The README's
  # first option is macOS + nix; the job that proves the shell has to run
  # where the attendees do.
  #
  # The first run pays for the nix store (rustc, the libraries, their
  # closures) from cache.nixos.org; cache-nix-action is deliberately not
  # here yet — measure the plain job first, add the cache if it earns it.
  ffi:
    name: C libraries (nix shell) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      # A dry `pkg-config` roll call before cargo: when a library is
      # missing this names it in one line, instead of a build-script
      # panic buried under a compile.
      - run: |
          nix-shell ../shell.nix --arg full true --run \
            'pkg-config --modversion caca libtcc libhs icu-i18n icu-uc chipmunk duckdb yara espeak-ng'
      # --all-features across the workspace: every feature-gated test runs,
      # including the ones asserting the C answer equals the pure-Rust one.
      # rustc, cargo and clippy are the shell's, not rustup's — that is the
      # point, and shell.nix carries clippy for exactly this reason.
      - run: nix-shell ../shell.nix --arg full true --run 'cargo test --workspace --all-features --locked'
      - run: |
          nix-shell ../shell.nix --arg full true --run \
            'cargo clippy --workspace --all-features --all-targets --locked -- -D warnings'
      # The wasm track's claim, in the shell attendees actually get: the
      # DEFAULT shell (no --arg full true) carries a rustc whose std includes
      # wasm32-unknown-unknown, because nixpkgs builds every rustc with that
      # target in its list. No C library is involved — a wasm build enables
      # neither caca nor tcc, so build.rs never runs pkg-config — which is
      # the whole practical argument for the track: it is the one real
      # boundary that runs in the shell attendees download on venue Wi-Fi.
      # The `wasm` job below is the same build on rustup's stable.
      - run: |
          nix-shell ../shell.nix --run \
            'cargo build -p aoc-2015-12-01 --lib --target wasm32-unknown-unknown --locked'

  # A cdylib built for wasm32-unknown-unknown exports its `extern "C"`
  # functions as-is, and Node's built-in WebAssembly API can call them with
  # no generator, no npm package and no CLI — the raw route the wasm track
  # (Exercise 4) is built on. What has to be true first is that the target's
  # std exists on the toolchains attendees have, and that the day and the
  # exercise crates compile for it at all: the days pull in miette's `fancy`
  # feature through the workspace table, and a terminal-colour dependency
  # that assumes a libc is exactly the kind of thing this target lacks. Both
  # questions have one honest answer, and it is this job going green.
  #
  # Three OSes, unlike the other jobs: the target is what is under test, and
  # native Windows is where a manual-setup attendee running `rustup target
  # add` would be. Only 2015-12-01 for the days, deliberately — it is the
  # day the track lands on; `--workspace` would also ask every C-linking
  # day to cross-compile, which is not a claim anyone is making.
  wasm:
    name: wasm32 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Both workspaces: this job builds exercises/ for the target too, and a
      # cache scoped to days/ leaves that build cold on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            days
            exercises
      - run: cargo build -p aoc-2015-12-01 --lib --target wasm32-unknown-unknown --locked
      # The attendee scaffold, as shipped: the Ex 2 wrapper's `*const c_char`
      # and `CStr` compile for this target unchanged, which is Exercise 4's
      # first lesson — the same crate, a different runtime, no edits.
      - run: cargo build --workspace --target wasm32-unknown-unknown --locked
        working-directory: exercises
      # The track, end to end, on 2015-12-01, through the recipe itself.
      # `just` is one more prebuilt binary from install-action (the Verify
      # workflow already takes it that way), installed here and only here
      # because this is the one job that calls a recipe. With it the job
      # runs `just wasm-demo` rather than a copy of its steps — so the
      # recipe, its version guard, the bare rebuild and the three consumers
      # are tested as attendees run them, and a step added to the recipe is
      # a step added here. Node 22 to match the wasm devcontainer, with npm's
      # cache keyed on the committed lockfile: a fresh runner never has
      # node_modules, so the recipe's own guard never helps here. Three
      # OSes, deliberately: every consumer computes its own paths and
      # prints UTF-8 through node, so this is the first track in the repo
      # with nothing Windows-shaped to work around.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: days/2015-12-01/wasm/package-lock.json
      # wasm-bindgen at the exact version the lockfile pins — read from the
      # lockfile with the same line the recipe's guard uses, so the pin
      # lives in days/Cargo.toml and nowhere else. Written into the
      # workflow as a literal, this job would trip the guard it exists to
      # exercise the day the crate is bumped.
      - id: pin
        shell: bash
        run: echo "wasm_bindgen=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@${{ steps.pin.outputs.wasm_bindgen }}
      # The recipe runs main (the generated lap), raw (linear memory, and
      # the hostile-input contract from the outside) and the banner test.
      # It needs a puzzle input: the statement example "()())", answers -1
      # and 5 — the same numbers the python cell in Verify asserts through
      # cffi. The recipe's own exit code is the gate; the greps after it
      # pin the two labels byte for byte, the way the kotlin cell does.
      # `just wasm-demo`, not `just days wasm-demo`: this step runs in days/
      # (the workflow default), where the nearest justfile is days/justfile
      # and the recipe is a top-level one. The `days` module prefix only
      # exists from the repo root. Found by review; the first version of
      # this step failed before any build on every trigger.
      - name: just wasm-demo 2015-12-01
        shell: bash
        run: |
          mkdir -p ../inputs
          printf '()())' > ../inputs/2015-12-01.txt
          out="$(just wasm-demo 2015-12-01)"
          echo "$out"
          echo "$out" | grep -qF 'Part 1 🧩(🦀): -1'
          echo "$out" | grep -qF 'Part 2 🧩(🦀): 5'
          echo "$out" | grep -qF 'contract: part1(NULL) -> status -1; part1(0xff 0xfe) -> status -1'
      # Not in the recipe, because an attendee running the day does not
      # need them: the typecheck (strict; the E channel is a type) and the
      # three-channel demo, which exits nonzero if Ok, Err or a trap lands
      # in the wrong one.
      - name: typecheck + the three channels (2015-12-01)
        shell: bash
        working-directory: days/2015-12-01/wasm
        run: |
          npm run -s typecheck
          npm run -s demo
