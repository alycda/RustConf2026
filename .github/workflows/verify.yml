# Verification matrix — bare-runner self-check map.
#
# Every cell runs scripts/self-check.sh on an UNPROVISIONED runner: no
# setup steps, no toolchain installs. The red/green grid that results is
# the observation, not a regression gate — it maps which cells GitHub's
# stock images cover for free and which need provisioning recipes, before
# the matrix is trimmed for heavy testing.
#
# Cell verdicts:
#   - rust, c   → the script's exit code (its required-toolchain contract:
#                 rustc + cargo + cbindgen + a C compiler that links).
#                 Both tracks share one verdict because the script does.
#   - python, dart, kotlin, swift
#               → green only if the script's own line for that track says
#                 "ready". The script's exit code is ignored for these:
#                 an optional track can be ready on a runner whose
#                 required toolchain is not (and vice versa), and that
#                 difference is signal.
#
#          | linux | macos | windows |
#   rust   |   .   |   .   |    .    |
#   c      |   .   |   .   |    .    |
#   python |   .   |   .   |    .    |
#   dart   |   .   |   .   |    .    |
#   kotlin |   .   |   .   |    .    |
#   swift  |   .   |   .   |    ?    |
#
# Expected reds (the "known failures"): cbindgen is preinstalled nowhere,
# so rust/c fail everywhere until provisioned; macOS images dropped Rust.
# The windows column is the "unknown" — the script runs under Git Bash
# there, which is more than the workshop promises (self-check's own
# Windows answer is WSL2), so whatever those cells report is new
# information by definition.

name: Verify

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.track }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        track: [rust, c, python, dart, kotlin, swift]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # shell: bash so the windows cells run under Git Bash rather than
      # PowerShell — the closest a native-Windows runner gets to running
      # this script at all.
      - name: bare self-check
        shell: bash
        run: |
          status=0
          out=$(./scripts/self-check.sh 2>&1) || status=$?
          printf '%s\n' "$out"
          echo
          echo "self-check exit code: $status"
          # Strip ANSI colour codes so the track grep sees plain text.
          plain=$(printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g')
          case "${{ matrix.track }}" in
            rust|c)
              exit "$status"
              ;;
            python) label='Python' ;;
            dart)   label='Dart' ;;
            kotlin) label='Kotlin/JNA' ;;
            swift)  label='Swift' ;;
          esac
          if printf '%s\n' "$plain" | grep -E "${label}[[:space:]]+ready" >/dev/null; then
            echo "${label}: ready on a bare runner"
          else
            echo "${label}: NOT ready on a bare runner"
            exit 1
          fi
