[package]
name = "aoc-2015-12-01"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the C-callable surface in src/c_api.rs (Exercise 2 — cbindgen
# generates a header from it, Exercise 3 consumes it from Python via cffi);
# rlib alongside it so main.rs, the tests, and the benches keep linking
# against this crate the normal Rust way.
[lib]
crate-type = ["rlib", "cdylib"]

# The tcc/caca variants link real C libraries at build time — build.rs
# probes pkg-config only for the features you enable — so they're off by
# default: a bare `cargo test --workspace` stays green on stock CI runners
# and the manual-setup path alike. The nix shell carries both libraries;
# the full absurdity is: cargo run --features caca,tcc
[features]
caca = []
tcc = []
# The generated wasm lap: #[wasm_bindgen] exports in src/wasm.rs. Off by
# default like the others, but for a different reason — nothing links here;
# the gate exists so the raw route (a bare `cargo build --target
# wasm32-unknown-unknown`) yields a module with no generator's glue in it.
wasm = ["dep:wasm-bindgen"]

[dependencies]
aoc-ornaments.workspace = true
derive_more.workspace = true
miette.workspace = true

# Only when compiling for wasm32: the host build never sees this table, so
# neither does the 1.85 floor check or any other day. src/wasm.rs says why
# a day that never draws a random number has to name a source for one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true
# Optional and target-scoped both: `--all-features` on the host enables the
# `wasm` feature and still compiles nothing from this crate, because the
# module that uses it is gated on the target.
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The pure-vs-JIT comparison needs the JIT: without the feature the target
# is skipped rather than failing --all-targets.
[[bench]]
name = "sum"
harness = false
required-features = ["tcc"]
