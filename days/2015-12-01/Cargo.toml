[package]
name = "aoc-2015-12-01"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the C-callable surface in src/c_api.rs (Exercise 2 — cbindgen
# generates a header from it, Exercise 3 consumes it from Python via cffi);
# rlib alongside it so main.rs, the tests, and the benches keep linking
# against this crate the normal Rust way.
[lib]
crate-type = ["rlib", "cdylib"]

# The tcc/caca variants link real C libraries at build time — build.rs
# probes pkg-config only for the features you enable — so they're off by
# default: a bare `cargo test --workspace` stays green on stock CI runners
# and the manual-setup path alike. The nix shell carries both libraries;
# the full absurdity is: cargo run --features caca,tcc
[features]
caca = []
tcc = []
# The generated wasm lap: #[wasm_bindgen] exports in src/wasm.rs. Off by
# default like the others, but for a different reason — nothing links here;
# the gate exists so the raw route (a bare `cargo build --target
# wasm32-unknown-unknown`) yields a module with no generator's glue in it.
wasm = ["dep:wasm-bindgen"]

# The R track's generated lap (src/extendr.rs). Unlike caca/tcc this one
# needs no pkg-config and no C library — it needs R: extendr-api links
# against libR and reads R's headers at build time, so `cargo build
# --features extendr` only works where `just setup-r` has been run (or
# inside `nix-shell -p R`). Optional for exactly the reason the wasm
# pin is explained the way it is: the msrv job and every stock CI runner
# build this workspace with default features, and neither has R.
extendr = ["dep:extendr-api"]

# The Godot track (src/godot.rs) — off by default for the usual reason plus
# one this repo has not had to state before.
#
# The usual reason: like caca/tcc, it is a variant nobody needs to build the
# day. The new one is MSRV. The `godot` crate declares rust-version = "1.94";
# days/Cargo.toml declares 1.85 (the edition-2024 floor), and
# .github/workflows/rust.yml has an `msrv` job that checks this workspace on
# exactly 1.85 so that floor is a tested claim rather than a hopeful one. An
# optional dependency is resolved into days/Cargo.lock but never compiled
# until a feature turns it on, so the floor job — which takes default
# features — never sees 1.94.
#
# Target-scoped (`[target.'cfg(...)'.dependencies]`, the way a wasm-only pin
# would be) is not available here: a GDExtension is a host cdylib, built for
# the same target as everything else. The gate has to be a feature.
#
# The compile-side gate is the `ffi` job, which runs --all-features inside
# the nix shell — nixpkgs' rustc is well past 1.94, so that job type-checks
# this module and the floor job still proves the floor.
godot = ["dep:godot"]

[dependencies]
aoc-ornaments.workspace = true
derive_more.workspace = true
miette.workspace = true

# Not a workspace dependency: one day uses it, behind a feature that only
# builds where R is installed. 0.9 is the current series.
extendr-api = { version = "0.9", optional = true }

# gdext, the Rust GDExtension bindings. Not in the workspace table: it is
# this day's alone, and pinning it next to the feature that switches it on
# keeps the MSRV note above within reading distance of the version it is
# about.
#
# `api-4-6` is the *minimum* engine this extension declares, not the engine
# it was tested against — GDExtension is forward compatible within 4.x, and
# the same .so loads in the 4.7.2 nixpkgs currently ships (which is what
# `just days godot-demo 2015-12-01` runs it under). Asking for 4.6 rather
# than 4.7 costs nothing here and keeps an attendee on last year's editor in
# the room. `aoc.gdextension` repeats the number as
# `compatibility_minimum`; the two have to agree, and the engine enforces it
# at load rather than at build.
godot = { version = "0.5.5", features = ["api-4-6"], optional = true }
# Only when compiling for wasm32: the host build never sees this table, so
# neither does the 1.85 floor check or any other day. src/wasm.rs says why
# a day that never draws a random number has to name a source for one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true
# Optional and target-scoped both: `--all-features` on the host enables the
# `wasm` feature and still compiles nothing from this crate, because the
# module that uses it is gated on the target.
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The pure-vs-JIT comparison needs the JIT: without the feature the target
# is skipped rather than failing --all-targets.
[[bench]]
name = "sum"
harness = false
required-features = ["tcc"]
