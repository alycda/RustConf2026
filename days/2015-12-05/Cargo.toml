[package]
name = "aoc-2015-12-05"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the C-callable surface in src/c_api.rs (Exercise 2 — cbindgen
# generates a header from it, Exercise 3 consumes it from Dart via
# dart:ffi); rlib alongside it so main.rs, the tests, and the hyperscan/icu
# modules keep linking against this crate the normal Rust way.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

[build-dependencies]
cc.workspace = true
