[package]
name = "aoc-2015-12-05"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the C-callable surface in src/c_api.rs (Exercise 2 — cbindgen
# generates a header from it, Exercise 3 consumes it from Dart via
# dart:ffi); rlib alongside it so main.rs, the tests, and the hyperscan/icu
# modules keep linking against this crate the normal Rust way.
[lib]
crate-type = ["rlib", "cdylib"]

# The hyperscan/icu variants link real C libraries at build time — build.rs
# probes pkg-config only for the features you enable — so they are off by
# default: a bare `cargo test --workspace` stays green on stock CI runners
# and on the manual-setup path alike. The nix shell carries both libraries;
# the head-to-head is: cargo test --features hyperscan,icu
#
# `hyperscan` is the module and feature name, `vectorscan` the package that
# provides it (libhs.pc) — the maintained fork, same API.
[features]
hyperscan = []
icu = []

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The three-way comparison needs both C libraries: without the features the
# target is skipped rather than failing --all-targets.
[[bench]]
name = "nice"
harness = false
required-features = ["hyperscan", "icu"]

[build-dependencies]
cc.workspace = true
