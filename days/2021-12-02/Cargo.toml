[package]
name = "aoc-2021-12-02"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The chipmunk variant links a real C library at build time — build.rs probes
# pkg-config only for the features you enable — so it's off by default: a bare
# `cargo test --workspace` stays green on stock CI runners and the
# manual-setup path alike. The nix shell carries the library (and the
# chipmunk.pc nixpkgs doesn't ship); the full absurdity is:
#   cargo run --features chipmunk
[features]
chipmunk = []

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# The pure-vs-physics comparison needs the physics: without the feature the
# target is skipped rather than failing --all-targets.
# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "dive"
harness = false
required-features = ["chipmunk"]
