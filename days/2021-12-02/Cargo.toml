[package]
name = "aoc-2021-12-02"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Declared bare on this line: the chipmunk module the feature selects lives
# with the day's FFI variants, and the feature exists here so the `dive`
# bench can hold itself out of default builds via required-features. Racing
# the two sides needs both in one tree — merge the day line in, then
# `cargo bench -p aoc-2021-12-02 --bench dive --features chipmunk`.
[features]
chipmunk = []

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The pure-vs-physics comparison needs the physics: without the feature the
# target is skipped rather than failing --all-targets.
[[bench]]
name = "dive"
harness = false
required-features = ["chipmunk"]
