[package]
name = "aoc-2021-12-02"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Both variants link real C libraries at build time — build.rs probes
# pkg-config only for the features you enable — so both are off by default: a
# bare `cargo test --workspace` stays green on stock CI runners and the
# manual-setup path alike. The nix shell carries both libraries (and the
# chipmunk.pc and duckdb.pc nixpkgs ships for neither). The full absurdity is:
#   cargo run --features chipmunk        # a physics engine
#   cargo run --features duckdb          # a database
#   cargo run --features chipmunk,duckdb # both compiled in; see Solution
[features]
chipmunk = []
duckdb = []

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The three-way race needs both libraries present, so it declares both:
# without either feature the target is skipped rather than failing
# --all-targets. Run it with `--features chipmunk,duckdb`.
[[bench]]
name = "dive"
harness = false
required-features = ["chipmunk", "duckdb"]
