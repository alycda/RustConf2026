# Config for `cbindgen` (Exercise 2). Regenerate with:
#   just days bindgen 2021-12-02
# The header isn't committed (see .gitignore) — cbindgen is required
# workshop tooling (scripts/self-check.sh), so regenerating it is always a
# `just` call away rather than a file to keep in sync by hand.

language = "C"
autogen_warning = "/* Generated by cbindgen from src/c_api.rs. Do not edit by hand — see cbindgen.toml. */"
include_guard = "AOC_2021_12_02_H"
sys_includes = ["stdint.h"]
no_includes = true
