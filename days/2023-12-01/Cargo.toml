[package]
name = "aoc-2023-12-01"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the C-callable surface in src/c_api.rs (Exercise 2 — cbindgen
# generates a header from it, Exercise 3 links against it from Swift); rlib
# alongside it so main.rs, the tests, and the benches keep linking against
# this crate the normal Rust way.
[lib]
crate-type = ["rlib", "cdylib"]

# Both variants link a real C library at build time — build.rs probes
# pkg-config, and for YARA also compiles yara_shim.c, only for the features
# you enable — so both are off by default: a bare `cargo test --workspace`
# stays green on stock CI runners and the manual-setup path alike. The nix
# shell carries both libraries.
#
# The two are not symmetrical, and the asymmetry is the day:
#   cargo run  -p aoc-2023-12-01 --features yara     # a malware-scanning engine
#   cargo test -p aoc-2023-12-01 --features espeak   # a speech synthesiser
# There is no `cargo run --features espeak`, because that variant deliberately
# does not answer the puzzle and nothing routes to it. See src/espeak.rs for
# what it does instead, and days/2023-12-01/README.md for why that is a
# result rather than a failure.
[features]
yara = []
espeak = []

[dependencies]
aoc-ornaments.workspace = true
miette.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true
# itertools.workspace = true
# nom.workspace = true

[dev-dependencies]
rstest.workspace = true

# Benchmarks are a bonus (`just days bench <day>`), not part of any workshop
# step — not every day carries one.
criterion.workspace = true

# harness = false hands the binary to criterion rather than libtest.
[[bench]]
name = "day"
harness = false

# The scoreboard needs the library it scores, so it declares the feature:
# without it the target is skipped rather than failing `--all-targets`, which
# is the same rule a bench racing a C library follows.
[[example]]
name = "espeak_scoreboard"
required-features = ["espeak"]
