[package]
name = "aoc-2024-12-01"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The qsort variant crosses into libc at runtime but needs no build.rs and
# no pkg-config — qsort ships in the C standard library every target already
# links. Off by default all the same: variants are opt-in, and the default
# build stays the pure-Rust reference. The same tests run through the C
# boundary with: cargo test --features qsort
[features]
qsort = []

[dependencies]
aoc-ornaments.workspace = true
itertools.workspace = true
miette.workspace = true
nom.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true

[dev-dependencies]
rstest.workspace = true
