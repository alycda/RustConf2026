[package]
name = "aoc-2024-12-01"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The cpp variant compiles src/cpp_sort.cpp at build time, which needs a
# C++ toolchain — so it's off by default: a bare `cargo test --workspace`
# stays green on stock CI runners and the manual-setup path alike. The nix
# shell's stdenv already carries the compiler; the full crossing is:
# cargo test --features cpp
[features]
cpp = []

# Compiled unconditionally (pure Rust, no system deps), invoked only when
# the cpp feature is on — build.rs says why it can't be optional.
[build-dependencies]
cc = "1"

[dependencies]
aoc-ornaments.workspace = true
itertools.workspace = true
miette.workspace = true
nom.workspace = true

# Reach for these as the solution needs them — versions match what
# aoc-ornaments already pulls in, so they cost no extra build.
# derive_more.workspace = true

[dev-dependencies]
rstest.workspace = true
