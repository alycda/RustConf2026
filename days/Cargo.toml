# rust-analyzer discovers Cargo.toml only at a workspace root and one level
# below it, so days/<date>/Cargo.toml is invisible to it, and its escape hatch
# (rust-analyzer.linkedProjects) takes no globs — every day would have to be
# listed by hand, in VS Code settings only. A virtual manifest here sits at the
# depth RA does look at, so every day is loaded, `just new` days included, in
# any editor that speaks RA.
#
# `*`, not `2*`: a glob that matches nothing is treated as a literal path and
# errors, and days/ holds only _template until the first `just new`, whereas
# `*` matching nothing is fine. The trade is that `*` claims every directory
# here, dotted ones included, and a claimed directory without a Cargo.toml
# fails every cargo command in the workspace — even one run from inside a
# healthy day. So days/target is excluded (cargo creates it on the first
# build), and anything else that lands here and isn't a day belongs in the
# exclude list beside it.
#
# Days are members, so they share days/Cargo.lock and days/target rather than
# locking and building one per day.
[workspace]
resolver = "3"
members = ["*"]
exclude = ["target", "inputs"]

# Every field and pin a day shares lives here once; members say
# `<key>.workspace = true`. Nine manifests inheriting one table means a
# version bump is a single edit — the alternative is nine, with CI
# green-lighting whichever ones you missed. The 1.85 floor below is still
# mirrored in two places that cannot inherit it — the
# dtolnay/rust-toolchain pin in .github/workflows/rust.yml and the
# `-ge 85` check in scripts/self-check.sh — so a floor change is this
# line plus those two.
[workspace.package]
edition = "2024"
rust-version = "1.85"

# Single-use pins (criterion, derive_more, itertools, nom, nom_locate) live
# here too: one table answers "what version of X does this repo use" for
# every crate.
[workspace.dependencies]
aoc-ornaments = "0.1.10"
cc = "1"

# Pinned to 0.7 on purpose: criterion 0.8 raised its MSRV to 1.86, and CI
# checks this workspace against rustc 1.85, the edition-2024 floor every day
# declares — and clap, which criterion pulls in, already sits exactly on that
# floor, so the committed days/Cargo.lock is load-bearing here: `--locked`
# everywhere is what stops a `cargo update` from raising the floor by way of a
# bonus. `default-features = false` drops criterion's rayon and plotters
# dependencies, which cost build time in a workspace that shares one target/
# across every day and, without the `html_reports` feature, buy nothing.
# For the HTML charts instead:
#   features = ["cargo_bench_support", "html_reports", "plotters"]
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

derive_more = { version = "1", features = ["deref"] }
itertools = "0.14"
miette = { version = "7.4", features = ["fancy"] }
nom = "7.1.3"
nom_locate = "4.2"
rstest = "0.24"
