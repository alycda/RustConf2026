# Your working directory, deliberately NOT part of days/.
#
# Why a workspace at all, for a couple of small crates:
# - One edition/rust-version pin below, instead of a copy per crate that
#   drifts 
# - One Cargo.lock and one target/, so ex2 building against ex1 is
#   incremental
# - rust-analyzer discovers manifests only at a workspace root and one level
#   below it (days/Cargo.toml documents the same constraint) — without this
#   file, exercises/ex1-pure-rust/Cargo.toml is invisible to the IDE
#

[workspace]
resolver = "3"
# ex4-wasm is a sibling of ex2-c-glue, not a feature on it: Ex 2 is the
# morning's contract and stays byte-identical; Ex 4 is the same wrapper on
# a different target plus the two exports that target needs.
members = ["ex1-pure-rust", "ex2-c-glue", "ex4-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
