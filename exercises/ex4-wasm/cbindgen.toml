# Same config as Ex 2's. The header this produces is generated for one
# reason — so you can put it next to the module's own export section, which
# build.sh prints, and see what survived the trip: the names did, the C
# types did not. Nothing on the wasm track reads it.
language = "C"
include_guard = "EX4_WASM_H"
autogen_warning = "/* Auto-generated by cbindgen — run `cbindgen --output include/ex4_wasm.h` to regenerate. */"
